<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Page Not Found · FieldSprout</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.35);
            padding: 3rem 2.5rem;
            max-width: 540px;
            width: 100%;
            text-align: center;
        }
        .wordmark {
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 2rem;
            letter-spacing: -0.5px;
        }
        .code {
            font-size: 5rem;
            font-weight: 800;
            line-height: 1;
            color: #6b7280;
            margin-bottom: 0.5rem;
        }
        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #111827;
            margin-bottom: 0.75rem;
        }
        .sub {
            color: #6b7280;
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }
        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            justify-content: center;
            margin-bottom: 2rem;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            text-decoration: none;
            transition: transform 0.15s, box-shadow 0.15s;
        }
        .btn:hover { transform: translateY(-1px); box-shadow: 0 8px 20px -4px rgba(0,0,0,0.15); }
        .btn-primary {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: #fff;
        }
        .btn-ghost {
            background: #fff;
            color: #4f46e5;
            border: 2px solid #e0e7ff;
        }
        .footer-note {
            font-size: 0.8rem;
            color: #9ca3af;
            padding-top: 1.5rem;
            border-top: 1px solid #f3f4f6;
        }
        .footer-note a { color: #4f46e5; text-decoration: none; font-weight: 600; }
        .footer-note a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="card">
        <div class="wordmark">FieldSprout</div>
        <div class="code">404</div>
        <h1>Page not found</h1>
        <p class="sub">
            The page you're looking for doesn't exist or may have been moved.
            Head back to the dashboard to pick up where you left off.
        </p>
        <div class="actions">
            <a href="/account/dashboard" class="btn btn-primary">Go to Dashboard</a>
            <a href="javascript:history.back()" class="btn btn-ghost">Go Back</a>
        </div>
        <div class="footer-note">
            If you followed a link that should work, <a href="mailto:support@fieldsprout.io">let us know</a>.
        </div>
    </div>
</body>
</html>
