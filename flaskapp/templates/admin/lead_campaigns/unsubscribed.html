<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unsubscribed</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            color: #333;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 40px;
            max-width: 480px;
            width: 90%;
            text-align: center;
        }
        .icon { font-size: 3rem; margin-bottom: 16px; color: #28a745; }
        h1 { font-size: 1.5rem; margin-bottom: 12px; color: #2c3e50; }
        p { color: #555; margin-bottom: 24px; line-height: 1.6; }
        .email-display {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 6px;
            padding: 10px 16px;
            font-size: 0.95rem;
            color: #495057;
            margin-bottom: 24px;
            word-break: break-all;
        }
        .btn {
            display: inline-block;
            padding: 12px 32px;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            text-decoration: none;
            background: #6c757d;
            color: white;
            transition: background 0.2s;
        }
        .btn:hover { background: #5a6268; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">&#10003;</div>
        <h1>You've been unsubscribed</h1>
        <p>We've successfully removed you from our outreach list. You won't receive any further emails from us.</p>
        {% if email %}
            <div class="email-display">{{ email }}</div>
        {% endif %}
        <a href="/" class="btn">Back to Home</a>
    </div>
</body>
</html>
