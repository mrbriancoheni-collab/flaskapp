{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto py-12">
  <h2 class="text-2xl font-bold mb-6">Sign in</h2>
  <form method="post" action="/login" class="space-y-4">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
      <input type="email" name="email" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"/>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
      <input type="password" name="password" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"/>
    </div>
    <button type="submit" class="w-full px-6 py-3 bg-indigo-600 text-white font-semibold rounded-lg hover:bg-indigo-700 transition">Sign in</button>
  </form>

  <div class="mt-6 text-center space-y-2">
    <p class="text-sm text-gray-600">
      Don't have an account? <a href="/register" class="text-indigo-600 hover:text-indigo-700 font-medium">Create one</a>
    </p>
  </div>

  <!-- Upgrade CTA -->
  <div class="mt-8 p-4 bg-gradient-to-r from-indigo-50 to-purple-50 border border-indigo-200 rounded-lg text-center">
    <p class="text-sm text-gray-700 mb-3">
      <strong>Want unlimited reports and full insights?</strong>
    </p>
    <button onclick="openPricingModal()" class="inline-flex items-center px-4 py-2 bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-semibold rounded-lg hover:from-indigo-700 hover:to-purple-700 transition">
      <i class="fa-solid fa-star mr-2"></i>
      Upgrade to Premium
    </button>
  </div>
</div>

<!-- Include Pricing Modal -->
{% include 'components/pricing_modal.html' %}
{% endblock %}
