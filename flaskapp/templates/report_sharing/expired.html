<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Report Expired</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">
  <div class="max-w-md mx-auto text-center px-4">
    <div class="bg-white border border-gray-200 rounded-xl p-8 shadow-lg">
      <div class="w-16 h-16 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-4">
        <i class="fa-solid fa-clock text-gray-400 text-2xl"></i>
      </div>
      <h1 class="text-xl font-bold text-gray-900 mb-2">Report Link Expired</h1>
      <p class="text-gray-600 mb-6">
        This report link is no longer available. It may have expired or been removed.
      </p>
      <p class="text-sm text-gray-500">
        Please contact the report owner for a new link.
      </p>
    </div>
  </div>
</body>
</html>
